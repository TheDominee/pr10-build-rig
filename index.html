<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>PR10 Build &amp; Rig</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#16202a;--muted:#5b6875;--line:#d4dbe2;--accent:#d99a00;--accent-ink:#1a1300;--bad:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e6edf3;--muted:#93a1ae;--line:#2a3642;--accent:#ffc83d;--accent-ink:#1a1300;--bad:#ff6b6b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.08);opacity:0;transition:opacity .2s}
body.ready .box{opacity:1}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
input{width:100%;font:600 17px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 15px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin:10px 0 0;font-size:13px}
#msg.bad{color:var(--bad)}
.foot{margin-top:16px;font-size:11.5px;color:var(--muted)}
</style>
</head>

var $=function(id){return document.getElementById(id);};
function u8(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
function ok(){ return window.crypto && crypto.subtle && window.DecompressionStream; }
async function openWith(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var b=u8(APP), gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));
  var html=await new Response(new Response(gz).body.pipeThrough(new DecompressionStream("gzip"))).text();
  var k=""; for(var i=0;i<raw.length;i++) k+=String.fromCharCode(raw[i]); k=btoa(k);
  window.__pr10k=k; try{ sessionStorage.setItem("pr10.k",k); }catch(e){}
  document.open(); document.write(html); document.close();
}
async function unwrap(pw){
  var norm=pw.toUpperCase().replace(/[^A-Z0-9]/g,""); if(!norm) return null;
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm),"PBKDF2",false,["deriveKey"]);
  var kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  for(var i=0;i<WRAPS.length;i++){ var b=u8(WRAPS[i]); try{ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},kek,b.slice(12))); }catch(e){} }
  return null;
}
(async function(){
  if(!ok()){ document.body.classList.add("ready"); $("msg").className="bad"; $("msg").textContent="This browser is too old to open the planner. Use a current Chrome, Edge, Safari or Firefox."; $("go").disabled=true; return; }
  var k=null; try{ k=sessionStorage.getItem("pr10.k"); }catch(e){}
  if(k){ try{ await openWith(u8(k)); return; }catch(e){ try{ sessionStorage.removeItem("pr10.k"); }catch(_){} } }
  document.body.classList.add("ready"); $("pw").focus();
})();
$("f").addEventListener("submit",async function(e){
  e.preventDefault(); var pw=$("pw").value; $("go").disabled=true; $("msg").className=""; $("msg").textContent="Checking…";
  try{
    var raw=await unwrap(pw);
    if(raw){ $("msg").textContent="Opening…"; await openWith(raw); return; }
    await new Promise(function(r){ setTimeout(r,900); });
    $("msg").className="bad"; $("msg").textContent="That password isn't right. Check it and try again.";
  }catch(err){ $("msg").className="bad"; $("msg").textContent="Something went wrong opening the planner. Reload and try again."; }
  $("go").disabled=false; $("pw").select();
});
})();
